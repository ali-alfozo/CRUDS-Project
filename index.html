<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUDS</title>
    <link rel="stylesheet" href="CrudsStyle.css">
</head>
<body>
    <div class="crud">
<div class="head"><h2>CRUDS</h2>
<P>PRODUCT MANAGEMENT SYSTEM</P> 

</div>
<div class="inputs">
 
    <input type="text" id="title" placeholder="title">
   <div class="price">
       <input type="number"onkeyup="getTotal()" placeholder="price" id="price">
       <input type="number"onkeyup="getTotal()" placeholder="taxes" id="taxes">
       <input type="number"onkeyup="getTotal()" placeholder="ads" id="ads">
       <input type="number"onkeyup="getTotal()" placeholder="discount" id="discount">
    <small id="total">65798</small>
   </div>
   <input type="number" id="count"placeholder="count">
   <input type="text" placeholder="category"id="category">
   <button id="submit">create</button>
</div>



<div class="outputs"><div class="searchblock">
    <input onkeyup="searchData(this.value)" type="text" id="search"placeholder="search">
    <div class="btnsearch">
        <button onclick="getsearchmood(this.id)" id="searchtitle"> Search by title</button>
        <button onclick="getsearchmood(this.id)" id="searchcategory"><search> Search by category</search></button>
    </div>
    <div id="deleteALL"></div>
    <table>
        <tr>
            <th>id </th>
            <th>title</th>
            <th>price </th>
            <th>taxes</th>
            <th>ads</th>
            <th>discount</th>
            <th>total</th>
            <th>category </th>
            <th>update </th>
            <th>delete </th>
        </tr>
        <tbody id="table">
         
        </tbody>
    </table>
</div>
</div>
    </div>
<button id="bttn">^</button>
<div><button id="themeToggle" style="width: auto; padding: 5px 15px; margin-top: 10px;">🌙 Dark</button></div>
<div id="toastMessage" class="toast hidden">
    <span id="toastText"></span>
</div>
    <script src="CrudsScript.js"></script>
</body>
</html>
